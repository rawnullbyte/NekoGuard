[package]
name = "nekoguard-certd"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
log = "0.4.34"
env_logger = "0.11"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "logging"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = "0.11.0"
base64 = "0.23.1"
rand = "0.10.2"
rcgen = "0.14.9"
http-body-util = "0.1.5"
rand_core = "0.10.1"
getrandom = "0.4.3"


