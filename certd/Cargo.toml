[package]
name = "nekoguard-certd"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server", "tokio", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.4"
log = "0.4.34"
env_logger = "0.11"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", features = ["json"] }
instant-acme.workspace = true
rustls = "0.23.43"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
