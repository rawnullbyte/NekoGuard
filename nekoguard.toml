# NekoGuard + certd shared configuration
# Both binaries read this file. Domains come from [[sites]].

# ── Shared ────────────────────────────────────────────────────────
[redis]
url = "redis://127.0.0.1:6379"

[rate_limit]
enabled = true
rps = 50
rpm = 600
burst = 50

[log]
level = "info"
file = "/etc/nekoguard/nekoguard.log"
requests = true

# ── Sites ─────────────────────────────────────────────────────────
[[sites]]
domain = "root-workspace.net"
upstream = "http://10.1.3.27:2368"

  [[sites.sub]]
  name = "nekobox"
  upstream = "https://10.1.3.30:443"
  bypass = [".*"]

[[sites]]
domain = "nullbyte.rip"
upstream = ""

  [[sites.sub]]
  name = "git"
  upstream = "http://10.1.3.12:3000"
  bypass = [".*"]

  [[sites.sub]]
  name = "vaultwarden"
  upstream = "http://10.1.3.18:8000"
  bypass = [".*"]

  [[sites.sub]]
  name = "immich"
  upstream = "http://10.1.3.16:2283"
  bypass = [".*"]

  [[sites.sub]]
  name = "status"
  upstream = "http://10.1.3.15:3001"

  [[sites.sub]]
  name = "torrent"
  upstream = "http://10.1.3.13:80"

# ── NekoGuard-specific ────────────────────────────────────────────
[nekoguard]
port = 443
whitelist = ["127.0.0.1"]

[nekoguard.session]
ttl = 1800

# ── Certd-specific ────────────────────────────────────────────────
[certd]
port = 8443
renewal_interval = 86400
contact_email = "me@nullbyte.rip"
cloudflare_api_token = "your-cloudflare-api-token"
