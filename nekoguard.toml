# NekoGuard shared configuration
# Read by both nekoguard and nekoguard-certd.
# Set NG_CONFIG env var to override path.

# ── Domains ───────────────────────────────────────────────────────
# Domains to manage certificates for and protect.
domains = ["root-workspace.net", "immich.root-workspace.net"]

# ── Redis ─────────────────────────────────────────────────────────
redis_url = "redis://127.0.0.1:6379"

# ── ACME (certd) ─────────────────────────────────────────────────
contact_email = "you@example.com"
cloudflare_api_token = "your-cloudflare-api-token"
cloudflare_zone_id = "your-zone-id"

# ── NekoGuard ─────────────────────────────────────────────────────
[nekoguard]
port = 443
whitelist = ["127.0.0.1"]

[nekoguard.session]
cookie_name = "nekoguard_session"
ttl = 1800

[nekoguard.rate_limit]
enabled = true
rps = 10
rpm = 600
burst = 20

[nekoguard.log]
level = "info"
file = "/var/log/nekoguard.log"
requests = true

# ── Sites (NekoGuard) ────────────────────────────────────────────
[[nekoguard.sites]]
domain = "root-workspace.net"
upstream = "http://10.1.3.16:2283"

  [[nekoguard.sites.sub]]
  name = "immich"
  upstream = "http://10.1.3.16:2283"

# ── Certd ────────────────────────────────────────────────────────
[certd]
port = 8443
renewal_interval = 86400
