# NekoGuard configuration.
# Copy to nekoguard.toml (or point NG_CONFIG at this file) and edit.

# NOTE: scalar settings must appear BEFORE the [[sites]] entries —
# in TOML, keys written after a [[sites]] header belong to that site.

# TLS listen port.
port = 443

# Permanent IP whitelist — these IPs bypass PoW entirely.
# whitelist = ["127.0.0.1", "10.0.0.1"]

# Logging configuration.
[log]
level    = "info"
# file   = "/var/log/nekoguard.log"
# requests = true

# Redis connection for session state and signing secret.
# Required for multi-replica deployments.
[redis]
url = "redis://127.0.0.1:6379"

# One entry per protected site. Each domain gets a Let's Encrypt certificate
# issued automatically, only accepts TLS handshakes addressed to it, and
# routes its authenticated traffic to its upstream.
#
# bypass: optional list of regexes matched against the request path; matching
# requests skip the PoW challenge (APIs, machine-facing routes). A [".*"]
# catch-all disables protection for that site entirely.
#
# An empty upstream skips the site entirely: no certificate is requested and
# SNI handshakes for it are refused (useful while DNS points elsewhere).
#
# Subdomains nest under their parent via [[sites.sub]] and expand to
# <name>.<domain>. A sub without its own upstream or bypass inherits the
# parent's.
[[sites]]
domain   = "root-workspace.net"
upstream = "https://10.1.3.27:2368"
bypass   = ["^/api/.*", "^/\\.well-known/"]

  [[sites.sub]]
  name     = "nekobox"
  upstream = "https://10.1.3.30:443"
  bypass   = []                          # override: fully protect this sub

  [[sites.sub]]
  name = "www"                           # inherits upstream + bypass

[[sites]]
domain   = "metrics.root-workspace.net"  # protection fully disabled here
upstream = "http://10.1.3.40:9090"
bypass   = [".*"]
