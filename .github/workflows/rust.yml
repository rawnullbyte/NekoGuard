name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        run: cargo build --workspace --release --verbose

      - name: Upload nekoguard binary
        uses: actions/upload-artifact@v4
        with:
          name: nekoguard-linux
          path: target/release/nekoguard

      - name: Upload certd binary
        uses: actions/upload-artifact@v4
        with:
          name: nekoguard-certd-linux
          path: target/release/nekoguard-certd

      - name: Run tests
        run: cargo test --workspace --verbose

      # The injected renewal script is browser code and can't be covered by
      # the Rust tests; these exercise its queue, expiry and wake-up handling.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test injected client script
        run: node --test nekoguard/tests/guard.test.mjs
