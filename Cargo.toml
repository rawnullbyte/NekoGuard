[package]
name = "nekoguard"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = [
    "client",
    "client-legacy",
    "http1",
    "http2",
    "tokio",
] }
hyper-tls = "0.6"
http-body-util = "0.1"
bytes = "1"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8.5.0"
rustls-acme = { version = "0.15.4", default-features = false, features = ["tokio", "ring", "tls12", "webpki-roots"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
futures = "0.3.34"
toml = "1.1.4"
tokio-util = { version = "0.7.19", features = ["compat"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
native-tls = "0.2.18"
regex = "1.13.1"
log = "0.4.34"
redis = { version = "1.6.0", features = ["tokio-comp", "connection-manager"] }
hmac = { version = "0.12", features = ["std"] }
base64 = "0.23.1"

[build-dependencies]
minify-html = "0.15"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
