apiVersion: apps/v1
kind: Deployment
metadata:
  name: nekoguard-certd
  namespace: nekoguard
spec:
  replicas: 1
  # `hostNetwork` below means the pod binds :8443 on the host directly. With
  # the default RollingUpdate the replacement pod starts and binds before the
  # old one has exited, so even a single-replica rollout crash-loops with
  # "Address already in use" until the backoff lets it win. Recreate tears the
  # old pod down first, which is the only strategy that works with a host port.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nekoguard-certd
  template:
    metadata:
      labels:
        app: nekoguard-certd
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: nekoguard-certd
          image: docker.io/library/nekoguard:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/nekoguard-certd"]
          securityContext:
            runAsUser: 0
          env:
            - name: NG_CONFIG
              value: /etc/nekoguard/nekoguard.toml
          volumeMounts:
            - name: config
              mountPath: /etc/nekoguard/nekoguard.toml
              subPath: nekoguard.toml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          hostPath:
            path: /etc/nekoguard
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nekoguard-certd
  namespace: nekoguard
spec:
  selector:
    app: nekoguard-certd
  ports:
    - port: 8443
