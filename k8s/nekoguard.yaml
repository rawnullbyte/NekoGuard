apiVersion: apps/v1
kind: Deployment
metadata:
  name: nekoguard
  namespace: nekoguard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nekoguard
  template:
    metadata:
      labels:
        app: nekoguard
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      containers:
        - name: nekoguard
          image: docker.io/library/nekoguard:latest
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/nekoguard"]
          securityContext:
            runAsUser: 0
          env:
            - name: NG_CONFIG
              value: /etc/nekoguard/nekoguard.toml
          volumeMounts:
            - name: config
              mountPath: /etc/nekoguard/nekoguard.toml
              subPath: nekoguard.toml
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          hostPath:
            path: /etc/nekoguard
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nekoguard
  namespace: nekoguard
spec:
  type: ClusterIP
  selector:
    app: nekoguard
  ports:
    - port: 443
      targetPort: 443
      name: https
    - port: 80
      targetPort: 80
      name: http
