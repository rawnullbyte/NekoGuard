apiVersion: v1
kind: ConfigMap
metadata:
  name: nekoguard-config
  namespace: nekoguard
data:
  nekoguard.toml: |
    [redis]
    url = "redis://redis:6379"

    [rate_limit]
    enabled = true
    rps = 10

    [log]
    level = "info"
    requests = true

    [[sites]]
    domain = "root-workspace.net"
    upstream = "http://10.1.3.16:2283"

    [nekoguard]
    port = 443

    [certd]
    port = 8443
    renewal_interval = 86400
    contact_email = ""
    cloudflare_api_token = ""
    cloudflare_zone_id = ""
